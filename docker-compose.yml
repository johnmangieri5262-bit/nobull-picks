version: "3.8"

services:
  app:
    build: .
    container_name: nobull-picks
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please}
      - INVITE_CODE=${INVITE_CODE:-NOBULL2026}
      - DB_PATH=./data/nobullpicks.db
      - PRICE_CRON=${PRICE_CRON:-*/5 9-16 * * 1-5}
    volumes:
      # Persist SQLite database across container restarts
      - db-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    driver: local
